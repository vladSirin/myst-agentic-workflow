name: tests

# WHY THIS EXISTS
#
# The repo is a skills library - mostly Markdown plus two PowerShell scripts.
# Its failure modes are (a) a .ps1 that breaks under Windows PowerShell 5.1 or
# carries non-ASCII bytes (5.1 assumes ANSI for BOM-less source), and (b) dead
# references and drifted manifests, which no test suite exists to catch once
# the content is prose. ps51-gates guards (a); lint guards (b).
#
# Windows runner on purpose: the scripts are written for and maintained on
# Windows; CI should run the same engines the maintainer and consumers run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR makes the first run's answer worthless - cancel it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows PowerShell 5.1 gates: the shipped .ps1 files must parse under the
  # OTHER engine consumers still run, and stay pure ASCII with no BOM.
  ps51-gates:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: PS 5.1 parse gate - every .ps1 parses under Windows PowerShell
        # shell: powershell IS Windows PowerShell 5.1 on windows runners.
        shell: powershell
        run: |
          "engine: $($PSVersionTable.PSVersion)"
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $errs = $null; $tok = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tok, [ref]$errs)
              if ($errs -and $errs.Count) {
                  $bad++
                  Write-Output ("::error title=PS 5.1 parse::" + $_.FullName)
                  $errs | ForEach-Object { Write-Output ("  " + $_.Message) }
              }
          }
          if ($bad -gt 0) { throw "$bad .ps1 file(s) do not parse under PowerShell 5.1" }
          "All .ps1 files parse under 5.1."

      - name: ASCII/BOM gate - no UTF-8 BOM, no non-ASCII bytes in any .ps1
        # 5.1 mangles BOM-less non-ASCII source (it assumes ANSI); the repo rule
        # is therefore pure ASCII with no BOM, asserted here byte-for-byte.
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $b = [IO.File]::ReadAllBytes($_.FullName)
              if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) {
                  $bad++
                  Write-Output ("::error title=BOM::{0} starts with a UTF-8 BOM" -f $_.FullName)
              }
              for ($i = 0; $i -lt $b.Length; $i++) {
                  if ($b[$i] -gt 127) {
                      $bad++
                      Write-Output ("::error title=non-ASCII::{0} byte 0x{1:x2} at offset {2}" -f $_.FullName, $b[$i], $i)
                      break
                  }
              }
          }
          if ($bad -gt 0) { throw "$bad .ps1 file(s) violate the ASCII/no-BOM rule" }
          "All .ps1 files are ASCII with no BOM."

  # The library's own consistency: skill frontmatter, manifest version
  # agreement, install one-liners, and no references to retired machinery.
  lint:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: SKILL.md frontmatter validity
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem plugins/myst-dev-kit/skills -Directory | ForEach-Object {
              $dir = $_.Name
              $f = Join-Path $_.FullName 'SKILL.md'
              if (-not (Test-Path $f)) {
                  $bad++; Write-Output "::error title=skill::$dir has no SKILL.md"; return
              }
              $lines = Get-Content $f
              if ($lines[0] -ne '---') {
                  $bad++; Write-Output "::error title=frontmatter::${dir}: SKILL.md does not open with '---'"; return
              }
              $close = -1
              for ($i = 1; $i -lt [Math]::Min($lines.Count, 50); $i++) {
                  if ($lines[$i] -eq '---') { $close = $i; break }
              }
              if ($close -lt 0) {
                  $bad++; Write-Output "::error title=frontmatter::${dir}: unclosed frontmatter"; return
              }
              $fm = $lines[1..($close - 1)] -join "`n"
              if ($fm -match '(?m)^name:\s*(\S+)') {
                  if ($Matches[1] -ne $dir) {
                      $bad++; Write-Output "::error title=frontmatter::${dir}: name '$($Matches[1])' does not match directory"
                  }
              } else {
                  $bad++; Write-Output "::error title=frontmatter::${dir}: no name field"
              }
              if ($fm -notmatch '(?m)^description:\s*\S') {
                  $bad++; Write-Output "::error title=frontmatter::${dir}: no description field"
              }
          }
          if ($bad -gt 0) { throw "$bad frontmatter problem(s)" }
          "All skill frontmatter valid."

      - name: The two plugin manifests agree on the version
        shell: pwsh
        run: |
          $a = (Get-Content -Raw plugins/myst-dev-kit/.claude-plugin/plugin.json | ConvertFrom-Json).version
          $b = (Get-Content -Raw plugins/myst-dev-kit/.codex-plugin/plugin.json | ConvertFrom-Json).version
          if ($a -ne $b) { throw "version disagreement: .claude-plugin says $a, .codex-plugin says $b" }
          "Both manifests: $a"

      - name: README carries every install one-liner
        shell: pwsh
        run: |
          $readme = Get-Content -Raw README.md
          $missing = 0
          foreach ($needle in @(
              '/plugin install myst-dev-kit@myst',
              'codex plugin add myst-dev-kit@myst',
              'npx skills add vladSirin/myst-agentic-workflow')) {
              if (-not $readme.Contains($needle)) {
                  $missing++
                  Write-Output "::error title=install one-liner::README.md is missing '$needle'"
              }
          }
          if ($missing -gt 0) { throw "$missing install one-liner(s) missing from README.md" }
          "All install one-liners present."

      - name: No references to retired machinery
        shell: pwsh
        # The v5 restructure deleted the installer/render machinery and several
        # skills/agents. Any reference outside the allowed history files is rot.
        # Excludes: history (CHANGELOG, ADRs, the migration inventory), working
        # state (.scratch/), the transitional stub + cleanup script, and this
        # workflow (it carries the token list itself).
        run: |
          $pattern = 'setup-devkit\.ps1|setup\.ps1|update\.ps1|upgrade\.ps1|promote\.ps1|install\.ps1|init-consumer\.ps1|package-manifest\.json|manifest-template\.json|scaffold-manifest|setup-agentic-workflow|review-changes|pre-implementation-gate|architecture-reviewer|radical-design-critic'
          $hits = git grep -nE $pattern -- `
              ':!CHANGELOG.md' `
              ':!docs/adr-*' `
              ':!docs/migration-v5.md' `
              ':!.scratch' `
              ':!setup-devkit.ps1' `
              ':!retire-legacy.ps1' `
              ':!.github/workflows/tests.yml'
          if ($LASTEXITCODE -eq 0) {
              $hits | ForEach-Object { Write-Output "::error title=dead reference::$_" }
              throw "dead references to retired machinery found"
          }
          "No dead references."
          # A clean tree means git grep exited 1, and the runner's pwsh wrapper
          # ends every step with `exit $LASTEXITCODE` - reset it or clean fails.
          exit 0
